
spring.application.name=kafka-event-app

server.port=8081

# Configuration Kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Configuration du Producer
spring.cloud.stream.bindings.producer-out-0.destination=messages-topic
spring.cloud.stream.bindings.producer-out-0.content-type=text/plain

# Configuration du Consumer
spring.cloud.stream.bindings.messageConsumer-in-0.destination=messages-topic
spring.cloud.stream.bindings.messageConsumer-in-0.group=messages-group
spring.cloud.stream.bindings.messageConsumer-in-0.content-type=text/plain

# Activation des fonctions Consumer et Supplier
spring.cloud.function.definition=messageConsumer;eventSupplier

# Configuration du Supplier
spring.cloud.stream.bindings.eventSupplier-out-0.destination=supplier-topic
spring.cloud.stream.bindings.eventSupplier-out-0.content-type=text/plain

# Génération automatique toutes les 5 secondes
spring.integration.poller.fixed-delay=5000
# ==============================
# CONFIGURATION KAFKA STREAMS
# ==============================

# Identifiant de l'application Kafka Streams
spring.kafka.streams.application-id=analytics-app

# Adresse du broker Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Sérialisation des clés et des valeurs
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
# Configuration du Listener Analytics
spring.kafka.consumer.group-id=analytics-display-group
spring.kafka.consumer.auto-offset-reset=earliest